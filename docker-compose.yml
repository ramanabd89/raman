# Production on a VPS: copy .env.example to .env, fill it in, then:  docker compose up -d --build
services:
  store:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1"
    volumes:
      - store-data:/data
    expose:
      - "3000"

  # Caddy = web server with automatic free HTTPS certificate for your domain.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN in .env} --to store:3000
    volumes:
      - caddy-data:/data
    depends_on:
      - store

volumes:
  store-data:
  caddy-data:
